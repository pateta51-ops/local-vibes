name: CI

# Runs on the owner's self-hosted runner. Push and manual runs only: no
# pull_request trigger, so code from other people's PRs never runs on that PC.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, local-vibes]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      # The build script uses chmod, so run npm scripts in Git Bash (not cmd or WSL bash).
      - run: npm test --script-shell="C:\Program Files\Git\bin\bash.exe"
