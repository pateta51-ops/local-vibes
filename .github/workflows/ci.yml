name: CI

# Runs on the owner's self-hosted runner. Push and manual runs only: no
# pull_request trigger, so code from other people's PRs never runs on that PC.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, local-vibes]
    defaults:
      run:
        # Git Bash, not C:\Windows\System32\bash.exe (WSL), which can't read Windows paths.
        shell: C:\Program Files\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm test
